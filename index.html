<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>SLP Session Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="SLP Tracker" />
<meta name="theme-color" content="#4f46e5" />
<link rel="apple-touch-icon" href="icon.png" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, 'DM Sans', 'Nunito', system-ui, sans-serif; background: #f8fafc; }
  button { -webkit-appearance: none; touch-action: manipulation; }
  textarea, input { -webkit-appearance: none; }
  .student-bar::-webkit-scrollbar { display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/plain" id="app-source">
const { useState, useEffect, useRef, useCallback } = React;

const TIMER_OPTIONS = [
  { label: "30s", seconds: 30 },
  { label: "1m", seconds: 60 },
  { label: "3m", seconds: 180 },
  { label: "5m", seconds: 300 },
  { label: "10m", seconds: 600 },
  { label: "15m", seconds: 900 },
  { label: "30m", seconds: 1800 },
];

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2, "0")}`;
}

function formatTimerLabel(seconds) {
  if (!seconds) return "";
  const opt = TIMER_OPTIONS.find(o => o.seconds === seconds);
  return opt ? opt.label : formatTime(seconds);
}

function playBeeps() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const beepAt = (startTime) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.6, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.18);
      osc.start(startTime);
      osc.stop(startTime + 0.18);
    };
    beepAt(ctx.currentTime);
    beepAt(ctx.currentTime + 0.25);
    beepAt(ctx.currentTime + 0.5);
  } catch {}
}

function makeId(prefix) {
  return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
}

function newGoal() {
  return {
    id: makeId("goal"),
    tid: makeId("t"),
    label: "",
    type: "percent",
    correct: 0,
    incorrect: 0,
    notes: "",
    skipped: false,
    fullGoal: "",
    target: null,
    ruleMode: "row",
    ruleN: 3,
    timerDuration: null,
    timerRemaining: null,
    timerRunning: false,
    timerAlert: false,
  };
}

function goalFromTemplate(t) {
  return {
    ...newGoal(),
    tid: t.tid || makeId("t"),
    label: t.label || "",
    type: t.type === "tally" ? "tally" : "percent",
    timerDuration: t.timerDuration ?? null,
    timerRemaining: t.timerDuration ?? null,
    fullGoal: t.fullGoal || "",
    target: typeof t.target === "number" ? t.target : null,
    ruleMode: t.ruleMode === "total" ? "total" : "row",
    ruleN: typeof t.ruleN === "number" ? t.ruleN : 3,
  };
}

function templatesFromGoals(goals) {
  return goals.map(g => ({
    tid: g.tid,
    label: g.label,
    type: g.type,
    timerDuration: g.timerDuration ?? null,
    fullGoal: g.fullGoal || "",
    target: typeof g.target === "number" ? g.target : null,
    ruleMode: g.ruleMode === "total" ? "total" : "row",
    ruleN: typeof g.ruleN === "number" ? g.ruleN : 3,
  }));
}

function normalizeGoalFields(g) {
  return {
    ...g,
    tid: g.tid || makeId("t"),
    skipped: !!g.skipped,
    fullGoal: g.fullGoal || "",
    target: typeof g.target === "number" ? g.target : null,
    ruleMode: g.ruleMode === "total" ? "total" : "row",
    ruleN: typeof g.ruleN === "number" ? g.ruleN : 3,
  };
}

function pointsFor(history, tid) {
  const pts = [];
  (history || []).forEach(entry => {
    (entry.goals || []).forEach(hg => {
      if (hg.tid === tid) pts.push({ date: entry.date, correct: hg.correct || 0, incorrect: hg.incorrect || 0 });
    });
  });
  return pts;
}

function pointPasses(p, type, target) {
  if (type === "percent") {
    const total = p.correct + p.incorrect;
    return total > 0 && Math.round((p.correct / total) * 100) >= target;
  }
  return p.correct >= target;
}

function isAtCriteria(goal, pastPoints) {
  if (typeof goal.target !== "number" || goal.target <= 0) return false;
  const points = [...(pastPoints || [])];
  const curTotal = (goal.correct || 0) + (goal.incorrect || 0);
  if (curTotal > 0) points.push({ date: new Date().toISOString(), correct: goal.correct || 0, incorrect: goal.incorrect || 0 });
  if (points.length === 0) return false;
  if (goal.ruleMode === "total") {
    const now = new Date();
    const monthPts = points.filter(p => {
      const d = new Date(p.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
    if (monthPts.length === 0) return false;
    const c = monthPts.reduce((s, p) => s + p.correct, 0);
    if (goal.type === "percent") {
      const t = monthPts.reduce((s, p) => s + p.correct + p.incorrect, 0);
      return t > 0 && Math.round((c / t) * 100) >= goal.target;
    }
    return c >= goal.target;
  }
  const n = goal.ruleN || 3;
  if (points.length < n) return false;
  return points.slice(-n).every(p => pointPasses(p, goal.type, goal.target));
}

function defaultSession() {
  return { goals: [newGoal(), newGoal()], reinforcers: "" };
}

function ConfirmModal({ message, confirmLabel, confirmColor, onConfirm, onCancel }) {
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 999,
    }}>
      <div style={{
        background: "#fff", borderRadius: 16, padding: "24px 20px",
        maxWidth: 300, width: "90%", textAlign: "center",
        boxShadow: "0 8px 32px rgba(0,0,0,0.18)",
      }}>
        <div style={{ fontSize: 15, fontWeight: 600, color: "#1e293b", marginBottom: 18, lineHeight: 1.5 }}>
          {message}
        </div>
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onCancel} style={{
            flex: 1, padding: "10px", borderRadius: 9,
            border: "1.5px solid #e2e8f0", background: "#f8fafc",
            color: "#64748b", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
          }}>Cancel</button>
          <button onClick={onConfirm} style={{
            flex: 1, padding: "10px", borderRadius: 9,
            border: "none", background: confirmColor || "#ef4444",
            color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
          }}>{confirmLabel || "Yes"}</button>
        </div>
      </div>
    </div>
  );
}

function PromptModal({ title, placeholder, initialValue, onSubmit, onCancel }) {
  const [value, setValue] = useState(initialValue || "");
  return (
    <div style={{
      position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)",
      display: "flex", alignItems: "center", justifyContent: "center", zIndex: 999,
    }}>
      <div style={{
        background: "#fff", borderRadius: 16, padding: "24px 20px",
        maxWidth: 320, width: "90%",
        boxShadow: "0 8px 32px rgba(0,0,0,0.18)",
      }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: "#1e293b", marginBottom: 14, textAlign: "center" }}>
          {title}
        </div>
        <input
          autoFocus
          value={value}
          onChange={e => setValue(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && value.trim()) onSubmit(value.trim()); }}
          placeholder={placeholder}
          style={{
            width: "100%", borderRadius: 9, border: "1.5px solid #e2e8f0",
            padding: "10px 12px", fontSize: 15, fontFamily: "inherit",
            outline: "none", color: "#1e293b", marginBottom: 14, boxSizing: "border-box",
          }}
        />
        <div style={{ display: "flex", gap: 10 }}>
          <button onClick={onCancel} style={{
            flex: 1, padding: "10px", borderRadius: 9,
            border: "1.5px solid #e2e8f0", background: "#f8fafc",
            color: "#64748b", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
          }}>Cancel</button>
          <button
            onClick={() => { if (value.trim()) onSubmit(value.trim()); }}
            style={{
              flex: 1, padding: "10px", borderRadius: 9,
              border: "none", background: "#4f46e5", opacity: value.trim() ? 1 : 0.5,
              color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
            }}>Save</button>
        </div>
      </div>
    </div>
  );
}

function GoalCard({ goal, onUpdate, onRemove, onSkip, canSkip, index, history, atCriteria }) {
  const intervalRef = useRef(null);
  const [confirm, setConfirm] = useState(null);
  const [timerOpen, setTimerOpen] = useState(false);
  const [detailsOpen, setDetailsOpen] = useState(false);

  const tick = useCallback(() => {
    onUpdate(goal.id, (prev) => {
      if (prev.timerRunning && prev.timerRemaining > 0) {
        const next = prev.timerRemaining - 1;
        if (next === 0) {
          try { window.navigator.vibrate && window.navigator.vibrate([300, 100, 300]); } catch {}
          playBeeps();
          return { ...prev, timerRemaining: 0, timerRunning: false, timerAlert: true };
        }
        return { ...prev, timerRemaining: next };
      }
      return prev;
    });
  }, [goal.id, onUpdate]);

  useEffect(() => {
    if (goal.timerRunning) {
      intervalRef.current = setInterval(tick, 1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return () => clearInterval(intervalRef.current);
  }, [goal.timerRunning, tick]);

  const correct = goal.correct ?? 0;
  const incorrect = goal.incorrect ?? 0;
  const total = goal.type === "percent" ? correct + incorrect : correct;
  const pct = total > 0 && goal.type === "percent" ? Math.round((correct / total) * 100) : null;

  const update = (fields) => onUpdate(goal.id, (prev) => ({ ...prev, ...fields }));

  const handlePlus = () => update({ correct: correct + 1 });
  const handleMinus = () => update({ incorrect: incorrect + 1 });
  const handleUndo = () => {
    if (goal.type === "percent") {
      if (incorrect > 0) update({ incorrect: incorrect - 1 });
      else if (correct > 0) update({ correct: correct - 1 });
    } else {
      if (correct > 0) update({ correct: correct - 1 });
    }
  };

  const handleTimerSelect = (sec) => {
    update({ timerDuration: sec, timerRemaining: sec, timerRunning: false, timerAlert: false });
  };
  const handleTimerToggle = () => {
    if (goal.timerAlert) update({ timerAlert: false, timerRunning: false });
    else update({ timerRunning: !goal.timerRunning, timerAlert: false });
  };

  const doConfirm = (type) => {
    if (type === "tally") update({ correct: 0, incorrect: 0 });
    if (type === "timer") update({ timerRemaining: goal.timerDuration, timerRunning: false, timerAlert: false });
    setConfirm(null);
  };

  const hasTimer = goal.timerDuration != null;
  const timerAlert = goal.timerAlert;

  return (
    <>
      {confirm === "remove" && (
        <div style={{
          position: "fixed", inset: 0, background: "rgba(0,0,0,0.45)",
          display: "flex", alignItems: "center", justifyContent: "center", zIndex: 999,
        }}>
          <div style={{
            background: "#fff", borderRadius: 16, padding: "24px 20px",
            maxWidth: 300, width: "90%", textAlign: "center",
            boxShadow: "0 8px 32px rgba(0,0,0,0.18)",
          }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: "#1e293b", marginBottom: 16, lineHeight: 1.5 }}>
              Remove "{goal.label || `Goal ${index + 1}`}"?
            </div>
            <button onClick={() => { onSkip(goal.id); setConfirm(null); }} style={{
              width: "100%", padding: "11px", borderRadius: 9, border: "none",
              background: "#4f46e5", color: "#fff", fontWeight: 700, fontSize: 14,
              cursor: "pointer", fontFamily: "inherit", marginBottom: 8,
            }}>Skip today — back next session</button>
            <button onClick={() => { onRemove(goal.id); setConfirm(null); }} style={{
              width: "100%", padding: "11px", borderRadius: 9, border: "none",
              background: "#ef4444", color: "#fff", fontWeight: 700, fontSize: 14,
              cursor: "pointer", fontFamily: "inherit", marginBottom: 8,
            }}>Remove for good</button>
            <button onClick={() => setConfirm(null)} style={{
              width: "100%", padding: "10px", borderRadius: 9,
              border: "1.5px solid #e2e8f0", background: "#f8fafc",
              color: "#64748b", fontWeight: 700, fontSize: 14, cursor: "pointer", fontFamily: "inherit",
            }}>Cancel</button>
          </div>
        </div>
      )}
      {(confirm === "tally" || confirm === "timer") && (
        <ConfirmModal
          message={confirm === "tally"
            ? "Reset all tally data for this goal? This cannot be undone."
            : "Reset the timer for this goal?"}
          confirmLabel="Yes, Reset"
          onConfirm={() => doConfirm(confirm)}
          onCancel={() => setConfirm(null)}
        />
      )}
      <div style={{
        background: timerAlert ? "#fff3cd" : "#ffffff",
        border: `2px solid ${timerAlert ? "#f59e0b" : "#e2e8f0"}`,
        borderRadius: 16,
        padding: "16px",
        marginBottom: 12,
        boxShadow: "0 2px 8px rgba(0,0,0,0.07)",
        transition: "border-color 0.3s, background 0.3s",
      }}>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
          <span style={{
            background: "#4f46e5", color: "#fff", borderRadius: "50%",
            width: 24, height: 24, display: "flex", alignItems: "center", justifyContent: "center",
            fontSize: 12, fontWeight: 700, flexShrink: 0,
          }}>{index + 1}</span>
          {atCriteria && <span title="At criteria — review">🎯</span>}
          <input
            value={goal.label}
            onChange={e => update({ label: e.target.value })}
            placeholder="Goal label..."
            style={{
              flex: 1, border: "none", borderBottom: "2px solid #e2e8f0",
              outline: "none", fontSize: 15, fontFamily: "inherit",
              fontWeight: 600, color: "#1e293b", background: "transparent", padding: "2px 4px",
            }}
          />
          <button onClick={() => (canSkip ? setConfirm("remove") : onRemove(goal.id))} style={{
            background: "none", border: "none", cursor: "pointer",
            color: "#cbd5e1", fontSize: 18, lineHeight: 1, padding: 2,
          }}>✕</button>
        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
          {["percent", "tally"].map(t => (
            <button key={t} onClick={() => update({ type: t })} style={{
              flex: 1, padding: "6px 0", borderRadius: 8, border: "2px solid",
              borderColor: goal.type === t ? "#4f46e5" : "#e2e8f0",
              background: goal.type === t ? "#4f46e5" : "#f8fafc",
              color: goal.type === t ? "#fff" : "#64748b",
              fontWeight: 600, fontSize: 13, cursor: "pointer", fontFamily: "inherit", transition: "all 0.15s",
            }}>
              {t === "percent" ? "% Correct" : "Tally"}
            </button>
          ))}
        </div>

        <div style={{
          background: "#f1f5f9", borderRadius: 10, padding: "10px 14px",
          marginBottom: 12, display: "flex", alignItems: "center", justifyContent: "space-between",
        }}>
          <div style={{ fontFamily: "monospace", fontSize: 22, fontWeight: 700, color: "#1e293b" }}>
            {goal.type === "percent" ? `${correct}/${total}` : `${correct}x`}
          </div>
          {goal.type === "percent" && (
            <div style={{
              fontSize: 26, fontWeight: 800,
              color: pct === null ? "#cbd5e1" : pct >= 80 ? "#16a34a" : pct >= 60 ? "#d97706" : "#dc2626",
            }}>
              {pct === null ? "—%" : `${pct}%`}
            </div>
          )}
          {goal.type === "tally" && (
            <div style={{ fontSize: 13, color: "#94a3b8", fontWeight: 600 }}>occurrences</div>
          )}
        </div>

        <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
          <button onClick={handlePlus} style={{
            flex: goal.type === "percent" ? 1 : 2,
            padding: "14px 0", borderRadius: 12, border: "none",
            background: "#22c55e", color: "#fff", fontSize: 24, fontWeight: 700,
            cursor: "pointer", boxShadow: "0 3px 0 #16a34a",
          }}>+</button>
          {goal.type === "percent" && (
            <button onClick={handleMinus} style={{
              flex: 1, padding: "14px 0", borderRadius: 12, border: "none",
              background: "#ef4444", color: "#fff", fontSize: 24, fontWeight: 700,
              cursor: "pointer", boxShadow: "0 3px 0 #b91c1c",
            }}>−</button>
          )}
          <button onClick={handleUndo} style={{
            padding: "14px 12px", borderRadius: 12, border: "2px solid #e2e8f0",
            background: "#f8fafc", color: "#64748b", fontSize: 12, fontWeight: 700, cursor: "pointer",
            fontFamily: "inherit",
          }}>↩ Undo</button>
          <button onClick={() => setConfirm("tally")} title="Reset all data for this goal" style={{
            padding: "14px 12px", borderRadius: 12, border: "2px solid #fecaca",
            background: "#fff5f5", color: "#ef4444", fontSize: 16, fontWeight: 700, cursor: "pointer",
          }}>↺</button>
        </div>

        <div>
          <button onClick={() => setTimerOpen(v => !v)} style={{
            display: "flex", alignItems: "center", width: "100%",
            gap: 6, background: "none", border: "none", cursor: "pointer",
            padding: "4px 0", marginBottom: timerOpen ? 8 : 0,
            fontFamily: "inherit",
          }}>
            <span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, color: "#94a3b8" }}>
              Timer
            </span>
            {hasTimer && !timerOpen && (
              <span style={{ fontSize: 12, color: "#4f46e5", fontWeight: 700 }}>
                {formatTimerLabel(goal.timerDuration)}
                {goal.timerRunning ? " ▶" : ""}
                {timerAlert ? " ⏰" : ""}
              </span>
            )}
            <span style={{ fontSize: 12, marginLeft: "auto", color: "#cbd5e1" }}>
              {timerOpen ? "▲" : "▼"}
            </span>
          </button>

          {timerOpen && (
            !hasTimer ? (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 5 }}>
                {TIMER_OPTIONS.map(opt => (
                  <button key={opt.seconds} onClick={() => handleTimerSelect(opt.seconds)} style={{
                    padding: "5px 10px", borderRadius: 6, border: "1.5px solid #e2e8f0",
                    background: "#f8fafc", color: "#475569", fontSize: 12, fontWeight: 600,
                    cursor: "pointer", fontFamily: "inherit",
                  }}>{opt.label}</button>
                ))}
              </div>
            ) : (
              <div style={{
                background: timerAlert ? "#fef3c7" : "#f1f5f9",
                borderRadius: 10, padding: "10px 12px",
                border: `1.5px solid ${timerAlert ? "#f59e0b" : "#e2e8f0"}`,
              }}>
                {timerAlert && (
                  <div style={{ color: "#92400e", fontWeight: 700, fontSize: 13, marginBottom: 6, textAlign: "center" }}>
                    ⏰ Time's up!
                  </div>
                )}
                <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8 }}>
                  <span style={{
                    fontFamily: "monospace", fontSize: 22, fontWeight: 700,
                    color: timerAlert ? "#92400e" : goal.timerRemaining < 10 ? "#dc2626" : "#1e293b",
                  }}>
                    {formatTime(goal.timerRemaining)}
                  </span>
                  <div style={{ display: "flex", gap: 5 }}>
                    <button onClick={handleTimerToggle} style={{
                      padding: "6px 12px", borderRadius: 7, border: "none",
                      background: goal.timerRunning ? "#f59e0b" : "#4f46e5",
                      color: "#fff", fontWeight: 700, fontSize: 13, cursor: "pointer", fontFamily: "inherit",
                    }}>{goal.timerRunning ? "⏸ Pause" : timerAlert ? "Dismiss" : "▶ Start"}</button>
                    <button onClick={() => setConfirm("timer")} title="Reset timer" style={{
                      padding: "6px 10px", borderRadius: 7, border: "1.5px solid #e2e8f0",
                      background: "#fff", color: "#64748b", fontWeight: 700, fontSize: 14, cursor: "pointer",
                    }}>↺</button>
                    <button onClick={() => update({ timerDuration: null, timerRemaining: null, timerRunning: false, timerAlert: false })} style={{
                      padding: "6px 10px", borderRadius: 7, border: "1.5px solid #fecaca",
                      background: "#fff", color: "#ef4444", fontWeight: 700, fontSize: 11, cursor: "pointer",
                    }}>✕</button>
                  </div>
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                  {TIMER_OPTIONS.map(opt => (
                    <button key={opt.seconds} onClick={() => handleTimerSelect(opt.seconds)} style={{
                      padding: "3px 8px", borderRadius: 5,
                      border: `1.5px solid ${goal.timerDuration === opt.seconds ? "#4f46e5" : "#e2e8f0"}`,
                      background: goal.timerDuration === opt.seconds ? "#ede9fe" : "#f8fafc",
                      color: goal.timerDuration === opt.seconds ? "#4f46e5" : "#64748b",
                      fontSize: 11, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
                    }}>{opt.label}</button>
                  ))}
                </div>
              </div>
            )
          )}
        </div>

        <div style={{ marginTop: 10 }}>
          <button onClick={() => setDetailsOpen(v => !v)} style={{
            display: "flex", alignItems: "center", width: "100%", gap: 6,
            background: "none", border: "none", cursor: "pointer", padding: "4px 0",
            fontFamily: "inherit",
          }}>
            <span style={{ fontSize: 11, fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, color: "#94a3b8" }}>
              Goal Details
            </span>
            {typeof goal.target === "number" && !detailsOpen && (
              <span style={{ fontSize: 11, color: "#4f46e5", fontWeight: 700 }}>
                {goal.target}{goal.type === "percent" ? "%" : "x"} · {goal.ruleMode === "total" ? "month total" : `${goal.ruleN} in a row`}
              </span>
            )}
            <span style={{ fontSize: 12, marginLeft: "auto", color: "#cbd5e1" }}>{detailsOpen ? "▲" : "▼"}</span>
          </button>
          {detailsOpen && (
            <div style={{ background: "#f8fafc", border: "1.5px solid #e2e8f0", borderRadius: 10, padding: 10 }}>
              <textarea
                value={goal.fullGoal}
                onChange={e => update({ fullGoal: e.target.value })}
                placeholder="Full goal wording & criteria (kept out of daily view)..."
                rows={2}
                style={{
                  width: "100%", borderRadius: 8, border: "1.5px solid #e2e8f0",
                  padding: "8px 10px", fontFamily: "inherit", fontSize: 12, color: "#334155",
                  resize: "vertical", outline: "none", background: "#fff", boxSizing: "border-box",

                <span style={{ fontSize: 12, fontWeight: 700, color: "#64748b" }}>Target</span>

                    width: 56, borderRadius: 7, border: "1.5px solid #e2e8f0", padding: "5px 8px",

                  <input
                    type="number"
                    value={goal.ruleN}
                    onChange={e => update({ ruleN: Math.max(1, Number(e.target.value) || 1) })}
                    style={{
                      width: 40, borderRadius: 7, border: "1.5px solid #e2e8f0", padding: "5px 8px",
                      fontSize: 13, fontFamily: "inherit", outline: "none", color: "#1e293b",
                    }}
                  />
                )}
                <button onClick={() => update({ ruleMode: "total" })} style={{
                  padding: "5px 9px", borderRadius: 7,
                  border: `1.5px solid ${goal.ruleMode === "total" ? "#4f46e5" : "#e2e8f0"}`,
                  background: goal.ruleMode === "total" ? "#ede9fe" : "#fff",
                  color: goal.ruleMode === "total" ? "#4f46e5" : "#64748b",
                  fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",

              </div>
              {history && history.length > 0 && (
                <div style={{ fontSize: 11, color: "#94a3b8", marginTop: 8, fontFamily: "monospace" }}>
                  {history.slice(-4).map((p, i) => {
                    const t = p.correct + p.incorrect;
                    const s = goal.type === "percent" ? `${p.correct}/${t}` : `${p.correct}x`;
                    return <span key={i} style={{ marginRight: 8 }}>{new Date(p.date).toLocaleDateString("en-US", { month: "numeric", day: "numeric" })} {s}</span>;

        <div style={{ marginTop: 10 }}>

            value={goal.notes}

              width: "100%", borderRadius: 8, border: "1.5px solid #e2e8f0",
              padding: "8px 10px", fontFamily: "inherit", fontSize: 13, color: "#334155",
              resize: "vertical", outline: "none", background: "#fafafa", boxSizing: "border-box",
            }}

        </div>

    </>
  );
}

function SummaryLine({ goal, index }) {
  const label = goal.label || `Goal ${index + 1}`;
  const correct = goal.correct ?? 0;
  const incorrect = goal.incorrect ?? 0;
  const total = goal.type === "percent" ? correct + incorrect : correct;
  const pct = total > 0 && goal.type === "percent" ? Math.round((correct / total) * 100) : null;
  const timerLabel = goal.timerDuration ? formatTimerLabel(goal.timerDuration) : null;

  let dataStr = "";
  if (goal.type === "percent") {
    dataStr = `${correct}/${total} — ${pct ?? "—"}% accuracy`;
  } else {
    dataStr = timerLabel ? `${total}x / ${timerLabel}` : `${total}x`;
  }

  return (
    <div style={{ marginBottom: 12 }}>
      <span style={{ fontWeight: 600, color: "#e2e8f0", fontSize: 14 }}>{label}</span>
      <span style={{ color: "#94a3b8", fontSize: 13 }}> — </span>
      <span style={{ color: "#cbd5e1", fontSize: 13, fontFamily: "monospace" }}>{dataStr}</span>
      {goal.notes.trim() && (
        <span style={{ color: "#94a3b8", fontSize: 13 }}>; {goal.notes.trim()}</span>
      )}
    </div>
  );
}

const STORAGE_KEY = "slp_tracker_v3";
const OLD_STORAGE_KEY = "slp_tracker_v2";

function loadStore() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.sessions) {
        const roster = (Array.isArray(parsed.roster) ? parsed.roster : []).map(s => ({
          ...s,
          history: Array.isArray(s.history) ? s.history : [],
          goals: (s.goals || []).map(normalizeGoalFields),
        }));
        const sessions = {};
        Object.keys(parsed.sessions).forEach(k => {
          const sess = parsed.sessions[k] || {};
          sessions[k] = { goals: (sess.goals || []).map(normalizeGoalFields), reinforcers: sess.reinforcers || "" };
        });
        return { roster, selectedId: parsed.selectedId || "quick", sessions };
      }
    }
  } catch {}
  // Migrate from the old single-session format so nothing is lost
  let quick = null;
  try {
    const old = localStorage.getItem(OLD_STORAGE_KEY);
    if (old) {
      const parsed = JSON.parse(old);
      if (parsed && parsed.goals && parsed.goals.length > 0) {
        quick = { goals: parsed.goals, reinforcers: parsed.reinforcers || "" };
      }
    }
  } catch {}
  return {
    roster: [],
    selectedId: "quick",
    sessions: quick ? { quick } : { quick: defaultSession() },
  };
}

function App() {
  const [store, setStore] = useState(loadStore);
  const [showSummary, setShowSummary] = useState(false);
  const [copied, setCopied] = useState(false);
  const [showRoster, setShowRoster] = useState(false);
  const [addingStudent, setAddingStudent] = useState(false);
  const [shareStatus, setShareStatus] = useState(null);

  const { roster, selectedId, sessions } = store;
  const session = sessions[selectedId] || defaultSession();
  const goals = session.goals;
  const reinforcers = session.reinforcers;
  const selectedStudent = roster.find(s => s.id === selectedId) || null;
  const studentHistory = selectedStudent ? (selectedStudent.history || []) : [];

  useEffect(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    } catch {}
  }, [store]);

  // Update the current session; if a student is selected, keep their saved
  // goal templates in sync so revised wording auto-loads next time.
  const setSession = useCallback((updater) => {
    setStore(prev => {
      const cur = prev.sessions[prev.selectedId] || defaultSession();
      const next = typeof updater === "function" ? updater(cur) : updater;
      const sessions = { ...prev.sessions, [prev.selectedId]: next };
      let roster = prev.roster;
      if (prev.selectedId !== "quick") {
        roster = prev.roster.map(s =>
          s.id === prev.selectedId ? { ...s, goals: templatesFromGoals(next.goals) } : s
        );
      }
      return { ...prev, sessions, roster };
    });
  }, []);

  const updateGoal = useCallback((id, updater) => {
    setSession(prev => ({
      ...prev,
      goals: prev.goals.map(g =>
        g.id === id
          ? (typeof updater === "function" ? updater(g) : { ...g, ...updater })
          : g
      ),
    }));
  }, [setSession]);

  const removeGoal = (id) => setSession(prev => ({ ...prev, goals: prev.goals.filter(g => g.id !== id) }));
  const skipGoal = (id) => updateGoal(id, { skipped: true });
  const unskipGoal = (id) => updateGoal(id, { skipped: false });
  const addGoal = () => setSession(prev =>
    prev.goals.length < 10 ? { ...prev, goals: [...prev.goals, newGoal()] } : prev
  );
  const setReinforcers = (val) => setSession(prev => ({ ...prev, reinforcers: val }));

  const selectStudent = (sid) => {
    setShowSummary(false);
    setStore(prev => {
      let sessions = prev.sessions;
      if (!sessions[sid]) {
        let goals;
        if (sid === "quick") {
          goals = [newGoal(), newGoal()];
        } else {
          const st = prev.roster.find(s => s.id === sid);
          goals = (st && st.goals && st.goals.length > 0)
            ? st.goals.map(goalFromTemplate)
            : [newGoal(), newGoal()];
        }
        sessions = { ...sessions, [sid]: { goals, reinforcers: "" } };
      }
      return { ...prev, sessions, selectedId: sid };
    });
  };

  const addStudent = (name) => {
    const id = makeId("student");
    setAddingStudent(false);
    setShowSummary(false);
    setStore(prev => ({
      ...prev,
      roster: [...prev.roster, { id, name, goals: [] }],
      selectedId: id,
      sessions: { ...prev.sessions, [id]: defaultSession() },
    }));
  };

  const renameStudent = (id, name) => {
    setStore(prev => ({
      ...prev,
      roster: prev.roster.map(s => (s.id === id ? { ...s, name } : s)),
    }));
  };

  const deleteStudent = (id) => {
    setStore(prev => {
      const sessions = { ...prev.sessions };
      delete sessions[id];
      return {
        ...prev,
        roster: prev.roster.filter(s => s.id !== id),
        selectedId: prev.selectedId === id ? "quick" : prev.selectedId,
        sessions,
      };
    });
  };

  const openHistory = () => {
    if (!selectedStudent) return;
    const payload = {
      name: selectedStudent.name,
      goals: selectedStudent.goals || [],
      history: selectedStudent.history || [],
    };
    const data = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    const url = `history.html#${data}`;
    const w = window.open(url, "_blank");
    if (!w) window.location.href = url;
  };

  const shareRoster = async () => {
    const payload = JSON.stringify({
      slpRoster: 1,
      students: roster.map(s => ({ name: s.name, goals: s.goals || [], history: s.history || [] })),
    });
    if (navigator.share) {
      try {
        await navigator.share({ text: payload });
        return;
      } catch {}
    }
    try {
      await navigator.clipboard.writeText(payload);
      setShareStatus("✓ Roster code copied!");
      setTimeout(() => setShareStatus(null), 2500);
    } catch {
      setShareStatus("Could not share — try again");
      setTimeout(() => setShareStatus(null), 2500);
    }
  };

  const importRoster = (text) => {
    try {
      // Tolerate extra text around the JSON (e.g. from a Messages paste)
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      if (start === -1 || end === -1) throw new Error();
      const parsed = JSON.parse(text.slice(start, end + 1));
      if (parsed.slpRoster !== 1 || !Array.isArray(parsed.students)) throw new Error();
      const cleanGoal = (t) => normalizeGoalFields({
        tid: typeof t.tid === "string" ? t.tid : null,
        label: typeof t.label === "string" ? t.label : "",
        type: t.type === "tally" ? "tally" : "percent",
        timerDuration: typeof t.timerDuration === "number" ? t.timerDuration : null,
        fullGoal: t.fullGoal,
        target: t.target,
        ruleMode: t.ruleMode,
        ruleN: t.ruleN,
      });
      const incoming = parsed.students.filter(s => s && typeof s.name === "string" && s.name.trim());
      let added = 0, merged = 0, newSessions = 0;
      const newRoster = [...roster];
      incoming.forEach(s => {
        const inGoals = (Array.isArray(s.goals) ? s.goals : []).map(cleanGoal);
        const inHist = (Array.isArray(s.history) ? s.history : []).filter(h => h && typeof h.date === "string");
        const idx = newRoster.findIndex(r => r.name.trim().toLowerCase() === s.name.trim().toLowerCase());
        if (idx === -1) {
          newRoster.push({ id: makeId("student"), name: s.name.trim(), goals: inGoals, history: inHist.slice(-40) });
          added++;
          newSessions += inHist.length;
          return;
        }
        const local = newRoster[idx];
        const localGoals = [...(local.goals || [])];
        const beforeLen = localGoals.length;
        const tidMap = {};
        inGoals.forEach(ig => {
          let match = localGoals.find(lg => lg.tid === ig.tid);
          if (!match && ig.label.trim()) {
            match = localGoals.find(lg => (lg.label || "").trim().toLowerCase() === ig.label.trim().toLowerCase());
          }
          if (match) {
            tidMap[ig.tid] = match.tid;
          } else {
            localGoals.push(ig);
            tidMap[ig.tid] = ig.tid;
          }
        });
        const have = new Set((local.history || []).map(h => h.date));
        const extra = inHist
          .filter(h => !have.has(h.date))
          .map(h => ({ ...h, goals: (h.goals || []).map(hg => ({ ...hg, tid: tidMap[hg.tid] || hg.tid })) }));
        const history = [...(local.history || []), ...extra]
          .sort((a, b) => new Date(a.date) - new Date(b.date))
          .slice(-40);
        newRoster[idx] = { ...local, goals: localGoals, history };
        if (extra.length > 0 || localGoals.length > beforeLen) merged++;
        newSessions += extra.length;
      });
      if (added === 0 && merged === 0) {
        return { ok: false, text: "Nothing new in that code (already in sync?)" };
      }
      setStore(prev => ({ ...prev, roster: newRoster }));
      return { ok: true, text: `✓ ${added} added, ${merged} merged, ${newSessions} session${newSessions === 1 ? "" : "s"} synced` };
    } catch {
      return { ok: false, text: "That doesn't look like a roster code — paste the whole thing" };
    }
  };

  const buildSummaryHTML = () => {
    const now = new Date();
    const dateStr = now.toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
    let html = `<p><strong>${dateStr}</strong></p>`;
    goals.filter(g => !g.skipped).forEach((g, i) => {
      const label = g.label || `Goal ${i + 1}`;
      const correct = g.correct ?? 0;
      const incorrect = g.incorrect ?? 0;
      const total = g.type === "percent" ? correct + incorrect : correct;
      const pct = total > 0 && g.type === "percent" ? Math.round((correct / total) * 100) : null;
      const timerLabel = g.timerDuration ? formatTimerLabel(g.timerDuration) : null;
      let dataStr = g.type === "percent"
        ? `${correct}/${total} — ${pct ?? "—"}% accuracy`
        : timerLabel ? `${total}x / ${timerLabel}` : `${total}x`;
      let line = `${label} — ${dataStr}`;
      if (g.notes.trim()) line += `; ${g.notes.trim()}`;
      html += `<p>${line}</p>`;
    });
    if (reinforcers.trim()) {
      html += `<p><em>Reinforcers/Activities/Other: ${reinforcers.trim()}</em></p>`;
    }
    return html;
  };

  const buildSummaryPlainText = () => {
    const now = new Date();
    const dateStr = now.toLocaleDateString("en-US", {
      weekday: "long", month: "long", day: "numeric", year: "numeric"
    });
    let lines = [dateStr, ""];
    goals.filter(g => !g.skipped).forEach((g, i) => {
      const label = g.label || `Goal ${i + 1}`;
      const correct = g.correct ?? 0;
      const incorrect = g.incorrect ?? 0;
      const total = g.type === "percent" ? correct + incorrect : correct;
      const pct = total > 0 && g.type === "percent" ? Math.round((correct / total) * 100) : null;
      const timerLabel = g.timerDuration ? formatTimerLabel(g.timerDuration) : null;
      let dataStr = g.type === "percent"
        ? `${correct}/${total} — ${pct ?? "—"}% accuracy`
        : timerLabel ? `${total}x / ${timerLabel}` : `${total}x`;
      let line = `${label} — ${dataStr}`;
      if (g.notes.trim()) line += `; ${g.notes.trim()}`;
      lines.push(line);
      lines.push("");
    });
    if (reinforcers.trim()) lines.push(`Reinforcers/Activities/Other: ${reinforcers.trim()}`);
    return lines.join("\n").trim();
  };

  const handleCopy = async () => {
    const html = buildSummaryHTML();
    const text = buildSummaryPlainText();
    try {
      if (window.ClipboardItem) {
        const item = new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" }),
        });
        await navigator.clipboard.write([item]);
      } else {
        await navigator.clipboard.writeText(text);
      }
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch (err) {
      try {
        await navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      } catch {}
    }
  };

  // New Session: for a student, keep their goal labels but zero the data.
  // For Quick mode, start completely fresh (old behavior).
  const handleNewSession = () => {
    setShowSummary(false);
    setStore(prev => {
      const cur = prev.sessions[prev.selectedId] || defaultSession();
      let roster = prev.roster;
      if (prev.selectedId !== "quick") {
        const logged = cur.goals
          .filter(g => !g.skipped && (g.correct || 0) + (g.incorrect || 0) > 0)
          .map(g => ({ tid: g.tid, label: g.label, type: g.type, correct: g.correct || 0, incorrect: g.incorrect || 0 }));
        roster = prev.roster.map(s => {
          if (s.id !== prev.selectedId) return s;
          const history = logged.length > 0
            ? [...(s.history || []), { date: new Date().toISOString(), goals: logged }].slice(-40)
            : (s.history || []);
          return { ...s, history };
        });
      }
      const goals = prev.selectedId === "quick"
        ? [newGoal(), newGoal()]
        : cur.goals.map(goalFromTemplate);
      const sessions = { ...prev.sessions, [prev.selectedId]: { goals, reinforcers: "" } };
      return { ...prev, roster, sessions };
    });
  };

  return (
    <div style={{
      maxWidth: 480, margin: "0 auto", minHeight: "100vh",
      background: "#f8fafc",
      fontFamily: "'DM Sans', 'Nunito', system-ui, sans-serif",
      paddingBottom: 100,
    }}>
      {addingStudent && (
        <PromptModal
          title="Add Student"
          placeholder="Student name or initials..."
          onSubmit={addStudent}
          onCancel={() => setAddingStudent(false)}
        />
      )}

      <div style={{
        background: "linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%)",
        padding: "20px 20px 16px", color: "#fff",
      }}>
        <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, opacity: 0.75, textTransform: "uppercase", marginBottom: 2 }}>
          Session Tracker
        </div>
        <div style={{ fontSize: 22, fontWeight: 800, letterSpacing: -0.5 }}>
          {selectedStudent ? selectedStudent.name : "SLP Data Collection"}
        </div>
      </div>

      <StudentBar
        roster={roster}
        selectedId={selectedId}
        onSelect={selectStudent}
        onAdd={() => setAddingStudent(true)}
        onManage={() => setShowRoster(v => !v)}
        onHistory={openHistory}
      />

      {showRoster && (
        <RosterPanel
          roster={roster}
          onRename={renameStudent}
          onDelete={deleteStudent}
          onShare={shareRoster}
          onImport={importRoster}
          onClose={() => setShowRoster(false)}
          shareStatus={shareStatus}
        />
      )}

      <div style={{ padding: "12px 16px 0" }}>
        {goals.filter(g => !g.skipped).map((g, i) => (
          <GoalCard key={g.id} goal={g} index={i} onUpdate={updateGoal} onRemove={removeGoal} onSkip={skipGoal} canSkip={selectedId !== "quick"} history={pointsFor(studentHistory, g.tid)} atCriteria={isAtCriteria(g, pointsFor(studentHistory, g.tid))} />
        ))}
        {goals.some(g => g.skipped) && (
          <div style={{
            background: "#f1f5f9", border: "1.5px dashed #cbd5e1", borderRadius: 12,
            padding: "10px 12px", marginBottom: 12, fontSize: 12, color: "#64748b",
          }}>
            <span style={{ fontWeight: 700, textTransform: "uppercase", letterSpacing: 1, fontSize: 10, color: "#94a3b8" }}>Skipped today — tap to restore </span>
            {goals.filter(g => g.skipped).map(g => (
              <button key={g.id} onClick={() => unskipGoal(g.id)} style={{
                margin: "2px 4px", padding: "4px 10px", borderRadius: 999,
                border: "1.5px solid #e2e8f0", background: "#fff", color: "#475569",
                fontSize: 12, fontWeight: 600, cursor: "pointer", fontFamily: "inherit",
              }}>{g.label || "Untitled goal"} ↩</button>
            ))}
          </div>
        )}
        {goals.length < 10 && (
          <button onClick={addGoal} style={{
            width: "100%", padding: "12px", borderRadius: 12,
            border: "2px dashed #c7d2fe", background: "#eef2ff",
            color: "#4f46e5", fontWeight: 700, fontSize: 14,
            cursor: "pointer", fontFamily: "inherit", marginBottom: 12,
          }}>+ Add Goal ({goals.length}/10)</button>
        )}

        <div style={{ marginBottom: 16 }}>
          <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", textTransform: "uppercase", letterSpacing: 1, marginBottom: 6 }}>
            Reinforcers / Activities / Other
          </div>
          <textarea
            value={reinforcers}
            onChange={e => setReinforcers(e.target.value)}
            placeholder="e.g. bubbles, iPad time, puzzle..."
            rows={2}
            style={{
              width: "100%", borderRadius: 10, border: "1.5px solid #e2e8f0",
              padding: "10px 12px", fontFamily: "inherit", fontSize: 14, color: "#334155",
              resize: "vertical", outline: "none", background: "#fff", boxSizing: "border-box",
            }}
          />
        </div>
      </div>

      {showSummary && (
        <div style={{
          margin: "0 16px 16px", background: "#1e293b",
          borderRadius: 14, padding: 16, color: "#e2e8f0",
        }}>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: "#94a3b8", textTransform: "uppercase", marginBottom: 12 }}>
            Session Summary{selectedStudent ? ` — ${selectedStudent.name}` : ""}
          </div>
          {goals.filter(g => !g.skipped).map((g, i) => <SummaryLine key={g.id} goal={g} index={i} />)}
          {goals.some(g => !g.skipped && isAtCriteria(g, pointsFor(studentHistory, g.tid))) && (
            <div style={{ background: "#312e81", borderRadius: 9, padding: "8px 10px", fontSize: 12, color: "#c7d2fe", marginBottom: 8 }}>
              🎯 At criteria — review: {goals.filter(g => !g.skipped && isAtCriteria(g, pointsFor(studentHistory, g.tid))).map((g, i) => g.label || `Goal ${i + 1}`).join("; ")} <span style={{ opacity: 0.7 }}>(screen only — not copied)</span>
            </div>
          )}
          {reinforcers.trim() && (
            <div style={{ borderTop: "1px solid #334155", paddingTop: 12, marginTop: 8, fontSize: 13, color: "#94a3b8" }}>
              <span style={{ fontWeight: 700, color: "#cbd5e1" }}>Reinforcers/Activities/Other:</span> {reinforcers.trim()}
            </div>
          )}
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <button onClick={handleCopy} style={{
              flex: 1, padding: "10px", borderRadius: 9, border: "none",
              background: copied ? "#22c55e" : "#4f46e5",
              color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer",
              fontFamily: "inherit", transition: "background 0.2s",
            }}>{copied ? "✓ Copied!" : "Copy to Clipboard"}</button>
            <button onClick={handleNewSession} style={{
              padding: "10px 14px", borderRadius: 9, border: "1.5px solid #475569",
              background: "transparent", color: "#94a3b8", fontWeight: 700,
              fontSize: 13, cursor: "pointer", fontFamily: "inherit",
            }}>New Session</button>
          </div>
        </div>
      )}

      <div style={{
        position: "fixed", bottom: 0, left: "50%", transform: "translateX(-50%)",
        width: "100%", maxWidth: 480, background: "#fff",
        borderTop: "1.5px solid #e2e8f0", padding: "12px 16px",
        display: "flex", gap: 10, boxSizing: "border-box", zIndex: 100,
        paddingBottom: "calc(12px + env(safe-area-inset-bottom))",
      }}>
        <button onClick={() => setShowSummary(v => !v)} style={{
          flex: 1, padding: "13px", borderRadius: 12, border: "none",
          background: "linear-gradient(135deg, #4f46e5, #7c3aed)",
          color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer", fontFamily: "inherit",
        }}>{showSummary ? "Hide Summary" : "End Session →"}</button>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>

<script>
  // Manually compile and run the app source above. We use type="text/plain"
  // on that script tag (not "text/babel") so babel-standalone's automatic
  // scanner never touches it — that scanner always layers on a CommonJS
  // module transform, which produces require() calls browsers can't run.
  // Here we call Babel.transform() ourselves with explicit options: classic
  // JSX runtime (no auto-imports) and sourceType "script" (no module
  // transform at all), then execute the resulting plain JS directly.
  const appSource = document.getElementById("app-source").textContent;
  const compiled = Babel.transform(appSource, {
    presets: [[Babel.availablePresets.react, { runtime: "classic" }]],
    sourceType: "script",
  }).code;
  (0, eval)(compiled);
</script>

<script>
  // Register service worker for offline support
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => {
        console.log('Service worker registration failed:', err);
      });
    });
  }
</script>

</body>
</html>
